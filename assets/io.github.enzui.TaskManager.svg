<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Task Manager</title>
  <defs>
    <filter id="enz-taskmanager-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- landscape keyline; card 92 x 72 (18..110 x 28..100) with a sheet turned -7 deg; 5 bars on y 90; pulse 7 px -->
  <g filter="url(#enz-taskmanager-drop)">
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#8BC34A" transform="rotate(-7 64 64)"/>
    <rect x="18" y="28" width="92" height="72" rx="9" fill="#FFFFFF"/>
  </g>
  <g fill="#D3EBB4">
    <rect x="29" y="64" width="10" height="26" rx="3"/>
    <rect x="45" y="54" width="10" height="36" rx="3"/>
    <rect x="61" y="70" width="10" height="20" rx="3"/>
    <rect x="77" y="48" width="10" height="42" rx="3"/>
    <rect x="93" y="60" width="10" height="30" rx="3"/>
  </g>
  <path d="M28 62 H42 L52 42 L64 80 L74 52 L81 62 H100" fill="none" stroke="#7C4DFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
